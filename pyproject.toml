[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statverify-ai"
version = "1.0.0"
description = "Automated Statistical Analysis, Verification, and AI Explanation Platform"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "StatVerify AI Team" }
]
dependencies = [
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "pydantic>=2.0.0",
    "langgraph>=0.1.0",
    "google-generativeai>=0.3.0",
    "reportlab>=4.0.0",
    "loguru>=0.7.0",
    "streamlit>=1.30.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
