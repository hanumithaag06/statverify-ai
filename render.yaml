# StatVerify AI — Render Blueprint Deployment Specification
# Automatically provisions the Streamlit Web Application

services:
  # Main Interactive Streamlit Application
  - type: web
    name: statverify-ai-web
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /_stcore/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MODEL_NAME
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false

